[project]
name = "smarvii-worker"
version = "0.1.0"
description = "Background media processing and experimental analysis worker for Smarvii Sports"
requires-python = ">=3.12"
dependencies = [
  "anthropic==2.4.0",
  "httpx==0.28.1",
  "pydantic==2.14.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.5"]

[project.scripts]
smarvii-worker = "smarvii_worker.main:main"
smarvii-eval = "smarvii_worker.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smarvii_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a running local Supabase stack"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S311", "E501"]  # line length is owned by `ruff format`; long prose strings are allowed

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/smarvii_worker/config.py" = ["S108"]  # default scratch dir inside the container; overridable via WORKER_TMP_DIR
